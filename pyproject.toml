[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reactx"
version = "0.0.1"
description = "2D reaction scheme to 3D NEB trajectory and Blender animation (Phase 0 spike)"
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2025.3",
    "ase>=3.26",
    "numpy>=2.0",
    "fairchem-core>=2.14",
    "torch>=2.5",
    "huggingface-hub>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[project.scripts]
reactx = "reactx.cli:main"

[tool.setuptools.packages.find]
include = ["reactx*"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
markers = [
    "slow: require UMA model download and run NEB to convergence",
    "blender: require local Blender install + atomic-blender-pdb-xyz add-on",
]
testpaths = ["tests"]
addopts = "-m 'not slow and not blender'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples_out", "uv.lock"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
]
ignore = [
    "E501",     # line-too-long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"blender/*" = ["F401", "E402"]   # bpy import order quirks

[tool.ruff.format]
quote-style = "double"
